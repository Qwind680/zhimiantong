<div class="bk">
  <!-- ═══════ 左侧导航 ═══════ -->
  <aside class="bk-side" id="bk-side" aria-label="题库分类">
    <button class="bk-side__close" type="button" id="bk-close" aria-label="关闭分类">×</button>
    <div class="bk-side__inner">
      <p class="bk-side__cap">分类</p>
      <nav id="bk-cats" aria-label="按职位类型分类"></nav>

      <p class="bk-side__cap bk-side__cap--fav">收藏</p>
      <nav id="bk-fav" aria-label="我收藏的题目"></nav>
    </div>
  </aside>

  <!-- ═══════ 右侧内容 ═══════ -->
  <main class="bk-main" id="bk-main">
    <div class="bk-main__inner">

      <header class="bk-head">
        <p class="zt-kicker">题库</p>
        <h1 class="bk-head__title" id="bk-title">全部题目</h1>
        <p class="bk-head__sub" id="bk-sub">按职位类型分类，点开题目看答案。</p>

        <div class="bk-tools">
          <div class="bk-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>
            </svg>
            <label class="zt-skip" for="bk-q">搜索题目</label>
            <input id="bk-q" type="search" placeholder="搜题干关键词，如「转化率」「索引」" autocomplete="off" />
            <button class="bk-search__clear" type="button" id="bk-clear" aria-label="清空搜索" hidden>&times;</button>
          </div>
          <div class="bk-filters" role="group" aria-label="按题型筛选">
            <button type="button" class="bk-chip is-on" data-ftype="all">全部</button>
            <button type="button" class="bk-chip" data-ftype="single">单选</button>
            <button type="button" class="bk-chip" data-ftype="multi">多选</button>
            <button type="button" class="bk-chip" data-ftype="judge">判断</button>
            <button type="button" class="bk-chip" data-ftype="short">简答</button>
          </div>
        </div>
      </header>

      <p class="bk-count" id="bk-count" aria-live="polite"></p>

      <ol class="bk-list" id="bk-list"></ol>

      <p class="bk-empty" id="bk-empty" hidden>
        <span class="bk-empty__t">这里还没有题目</span>
        <span class="bk-empty__s">换个分类或清空搜索条件试试。</span>
      </p>

      <p class="bk-note">
        答案与解析藏在题目里。答错再看，比先看答案记得牢。
      </p>
    </div>
  </main>
</div>

<button class="bk-sidebtn" type="button" id="bk-sidebtn" aria-expanded="false" aria-controls="bk-side">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
    <path d="M4 6h16M4 12h16M4 18h10"/>
  </svg>
  分类
</button>
<div class="bk-scrim" id="bk-scrim" hidden></div>
